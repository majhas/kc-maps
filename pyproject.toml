[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kcmaps"
version = "1.0.0"
description = "Kolmogorov-Chapman maps: trajectory-free learning of one-step transition kernels for molecular dynamics"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "jax>=0.9.2,<0.10",
    "flax>=0.12.6,<0.13",
    "optax>=0.2.8",
    "numpy>=2.0",
    "scipy>=1.14",
    "msgpack>=1.0",
    "hydra-core==1.3.2",
    "omegaconf==2.3.0",
    "pyyaml>=6.0",
    "openmm>=8.1",
    "mdtraj>=1.10",
    "pot>=0.9.5",
    "h5py>=3.10",
    "huggingface_hub>=0.34",
]

[project.optional-dependencies]
wandb = ["wandb>=0.26"]

[project.scripts]
kcm-train = "kcmaps.train:main"
kcm-simulate = "kcmaps.simulate:main"
kcm-evaluate = "kcmaps.evaluate:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["kcmaps", "kcmaps.*"]

[tool.setuptools.package-data]
kcmaps = ["assets/pdb/*.pdb", "assets/tica/*/*"]
